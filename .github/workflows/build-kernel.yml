name: build-kernel

# OnePlus Ace 5 Pro (hummer, SM8750) — 13T (Pagani) pipeline.
# 引擎由 ./unixnu 包装器准备：clone upstream.rev (d9460ebb) + 打 patches/ 三份补丁，
# 缓存后转交引擎自己的 unixnu。保留 hummer 的固件/ADT/触屏。

on:
  workflow_dispatch:
    inputs:
      root_image:
        description: '也生成 unixnu 分区的 root 镜像（约 8 GiB，需要约 16 GiB 空闲磁盘）'
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    # 只改文档不该烧一轮 40 分钟的 macOS 构建；代码 / 补丁 / board.toml 仍然自动编。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: hummer-xnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    # 必须显式给写权限：没有它 GITHUB_TOKEN 是只读的，gh release upload 会 403。
    # 而那一步带 continue-on-error，失败会被吞掉 —— 于是日志永远发不出来，
    # v75 连续几轮"看不见报错"就是这么来的。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 缓存 out/ipsw（OS+SystemOS 解压后约 8 GiB）。单独成条目、且 key 稳定，
      # 这样失败重跑不用再拉那 8 GiB——这正是之前每次重编都卡在拉 IPSW 的根因。
      # 单仓库缓存上限 10 GiB，8 GiB 的 ipsw 单独存得下；引擎树/feeds 放第二个条目尽力缓存。
      - name: Cache the fetched IPSW (OS + SystemOS, ~8 GiB)
        uses: actions/cache@v4
        with:
          path: out/ipsw
          key: hummer-ipsw-21H461-v1
          restore-keys: |
            hummer-ipsw-21H461-

      # 缓存这两块（第二轮起省掉 21 个子模块的 clone 和 7 个源码仓库的 fetch）：
      #   .cache      ./unixnu --prepare 产出的引擎树（按 upstream.rev + 补丁指纹命名，
      #               prepare() 发现有就直接返回，天然命中）
      #   out/feeds   ./unixnu fetch 的源码
      # 注意：若本仓库缓存总额已逼近 10 GiB，这个条目可能被 GitHub 拒存（非致命），
      # 下一轮会回退到重新 clone/fetch——但 ipsw 那条已命中，仍省掉最大的下载。
      - name: Cache the prepared engine and fetched feeds
        uses: actions/cache@v4
        with:
          path: |
            .cache
            out/feeds
          key: hummer-13t-${{ hashFiles('upstream.rev', 'patches/unixnu-source-kernel.patch', 'patches/native-ufs-sm8750.patch', 'patches/native-mobile-display-stage7.patch', 'patches/native-gop-presenter-hummer.patch', 'patches/adreno-a830.patch', 'patches/adreno-a830-m9.patch', 'board.toml') }}
          restore-keys: |
            hummer-13t-

      - name: Prepare the isolated, patched UniXNU source
        run: |
          # 先建日志目录并把 prepare 的输出落盘：这一步若失败（补丁打不上、
          # 子模块 gitlink 失效等），后面就没有日志可看，等于瞎修。
          mkdir -p out/hummer/logs
          # git 索引里若丢了可执行位，./unixnu 会 Permission denied；补一道。
          chmod +x ./unixnu 2>/dev/null || true
          ./unixnu --prepare 2>&1 | tee out/hummer/logs/actions-prepare.log
          TREE=$(./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"
          echo "engine tree: $TREE"

      # 注意：不要再把 hummer 老引擎时代的 patches/zzzz-hummer-stage7-compat.patch
      # 塞进引擎的 patches/xnu/。那份是从 Pagani 的 native-stage7-userspace-compat
      # 移植来的，现在整仓回到 Pagani 引擎 + 13T 三份补丁后，13T 的内核补丁已经改过
      # bsd/kern/ubc_subr.c、osfmk/vm/vm_fault.c、osfmk/vm/vm_protos.h，那份副本的
      # 上下文对不上 -> "patch does not apply"，而且它本身已成冗余（源头已生效）。

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm mtools openssl@3
          # A830 Metal userspace: Turnip's Vulkan runtime needs the shader tools,
          # Mesa 26 wants bison 3, and the metal2vulkan bridge is built by cargo.
          brew install glslang shaderc spirv-tools bison flex
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          command -v rustup >/dev/null || brew install rustup
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios
          xcodebuild -version

      - name: Fetch the kernel sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/hummer/logs
          ./unixnu defconfig hummer_defconfig
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily 2>&1 | tee out/hummer/logs/actions-fetch.log
          cp unixnu.lock out/hummer/unixnu.lock

      - name: Fetch the IPSW and prepare policies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # OS(4.9 GiB) + SystemOS(3.1 GiB) 很吃磁盘，先记一下余量，便于判断是不是
          # "no space left on device"（macOS runner 的可用空间并不宽裕）。
          df -h . | tee out/hummer/logs/actions-disk.log
          # 缓存命中则跳过抓取（省掉 8 GiB 下载）；只在文件缺失时才拉。
          if [ -f out/ipsw/21H461/044-76040-038.dmg ]; then
            echo "IPSW already restored from cache, skipping fetch" | tee out/hummer/logs/actions-ipsw.log
          else
            ./unixnu ipsw fetch AppleLogo KernelCache OS Cryptex1,SystemOS StaticTrustCache Cryptex1,SystemTrustCache 2>&1 | tee out/hummer/logs/actions-ipsw.log
          fi
          # 下面每条单独落盘：上几轮全塞在一个步骤里，挂了也不知道是哪一条。
          ./unixnu tree 2>&1 | tee out/hummer/logs/actions-tree.log
          df -h . | tee -a out/hummer/logs/actions-disk.log
          python3 scripts/audit-stage7-display.py out/ipsw/21H461/kernelcache.decompressed 2>&1 | tee out/hummer/logs/actions-audit-display.log
          python3 scripts/prepare-ufs-policies.py --tree out/hummer/tree --inputs out/ipsw/21H461 --openssl-prefix "$(brew --prefix openssl@3)" 2>&1 | tee out/hummer/logs/actions-policies.log
          python3 scripts/prepare-original-trust.py --tree "$UNIXNU_TREE" --inputs out/ipsw/21H461 --output out/hummer/original-static-system.bundle 2>&1 | tee out/hummer/logs/actions-trust.log

      - name: Prepare volatile Data
        run: |
          sudo "$(command -v python3)" scripts/prepare-ram-data.py --tree "$UNIXNU_TREE" --source out/ipsw/21H461/044-76040-038.dmg --systemos out/ipsw/21H461/044-76034-038.dmg --output out/hummer/ram-data --config out/hummer/.config 2>&1 | tee out/hummer/logs/actions-ram-data.log
          # sudo 造出来的 ram-data 归 root，而 root_image 那一步要用普通 rm 清掉它
          # （它只在 payload 阶段有用）。不交还属主的话，rm 会报 Permission denied，
          # set -e 直接让整步失败 —— root 镜像就永远生成不出来。
          sudo chown -R "$(id -u):$(id -g)" out/hummer/ram-data

      # GPU 用户态（照 13T 的 build-userspace-a830.sh 配方）：Mesa/Turnip(iOS)、
      # metal2vulkan 桥、NativeAdrenoMetal.bundle，写进 Data 种子的
      # /private/var/ngpu；同时产 owner trust bundle（三个 ad-hoc CDHash）。
      # 失败不挡 CPU 启动：payload 步骤检测产物，没有就退回原始 Data 种子，
      # 内核里 sheng-fb-gpu=1 的 offer 会被拒，显示自动走 CPU memcpy。
      - name: Build the A830 Metal userspace
        id: gpu
        continue-on-error: true
        run: |
          mkdir -p out/hummer/logs
          python3 scripts/build-hummer-metal.py \
            --tree out/hummer/tree \
            --data out/hummer/ram-data/data.dbrdisk \
            --trust out/hummer/original-static-system.bundle \
            --output out/hummer/gpu 2>&1 | tee out/hummer/logs/actions-gpu.log

      - name: Build XNU and the FAT payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if [ -z "$UNIXNU_UNIQUE_CHIP_ID" ]; then
            export UNIXNU_UNIQUE_CHIP_ID="$(python3 -c 'import secrets; print(secrets.token_hex(8))')"
          fi
          TRUST=out/hummer/original-static-system.bundle
          DATA=out/hummer/ram-data/data.dbrdisk
          if [ -f out/hummer/gpu/data-gpu.dbrdisk ] && [ -f out/hummer/gpu/owner-trust.bundle ]; then
            TRUST=out/hummer/gpu/owner-trust.bundle
            DATA=out/hummer/gpu/data-gpu.dbrdisk
            echo "GPU userspace staged: data=$DATA trust=$TRUST"
          else
            echo "GPU userspace absent: falling back to the CPU Data seed"
          fi
          # --skip-setup：payload 步骤读 board.toml [payload] skip_setup_tool，在 Data 种子
          # 的副本上把 Setup 标记为完成，系统起来直接进 SpringBoard 而不是 Hello。
          ./unixnu build kernel payload -j 3 --trust-cache "$TRUST" --data-ramdisk "$DATA" --skip-setup 2>&1 | tee out/hummer/logs/actions-build.log

      - name: Show build log tail
        if: always()
        run: |
          for f in out/hummer/logs/*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -n -iE "error:|error |Traceback|raise |fatal:|undefined|No such file|ld: " "$f" | tail -25 || true
          done
          tail -60 out/hummer/logs/actions-build.log 2>/dev/null || true

      - name: Check artifacts
        id: check
        run: |
          K=out/hummer/kernel/kernel.macho
          if [ -f "$K" ]; then echo "KERNEL_BUILT=yes" >> "$GITHUB_ENV"; ls -la "$K"; else echo "KERNEL_BUILT=no" >> "$GITHUB_ENV"; fi
          [ -f out/hummer/payload/payload.img ] && ls -la out/hummer/payload/payload.img || echo "payload.img not produced"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummer-xnu-${{ github.run_number }}
          path: |
            out/hummer/kernel/**
            out/hummer/payload/**
            out/hummer/gpu/**
            out/hummer/logs/**
            out/hummer/unixnu.lock
          if-no-files-found: warn
          retention-days: 7

      # 日志可诊断性：job logs 需要 admin、artifacts 需要认证，只有 release 资产
      # 是公开可下载的，所以每轮都把日志打到 ci-latest。删掉这一步就看不到报错。
      - name: Publish build outputs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 无论多早失败都要产出一个可上传的包，否则这一轮的报错永远看不到。
          tar czf ci-logs.tar.gz out/hummer/logs 2>/dev/null || true
          if [ ! -s ci-logs.tar.gz ]; then
            { echo "no hummer logs were produced (failure before the log dir)"; \
              echo "run: $GITHUB_RUN_ID"; } > ci-logs.txt
            tar czf ci-logs.tar.gz ci-logs.txt
          fi
          gh release view ci-latest >/dev/null 2>&1 || \
            gh release create ci-latest --title "ci latest" --notes "Rolling build outputs."
          for f in ci-logs.tar.gz out/hummer/kernel/kernel.macho out/hummer/payload/payload.img; do
            [ -f "$f" ] && gh release upload ci-latest "$f" --clobber
          done

      # ---------------------------------------------------------------------
      # 可选：生成 unixnu 分区的 root 镜像（OS 4.9 GiB + SystemOS 3.1 GiB ≈ 8 GiB）。
      # 只在手动触发且勾选 root_image 时跑 —— 它会把峰值磁盘需求推到 16 GiB
      # （缓存里那 8 GiB dmg + 生成的 8 GiB 镜像），macOS runner 平时不宽裕，
      # 所以先删掉已经上传过的构建产物和 Data 种子再开始。
      # 产物切成 1.9 GiB 分卷发到 ci-latest：release 单文件上限 2 GiB。
      # 用户侧合并：cat userdata-root.img.part* > userdata-root.img
      # ---------------------------------------------------------------------
      - name: Build the root image for the unixnu partition
        if: ${{ github.event.inputs.root_image == 'true' }}
        run: |
          df -h . | tee out/hummer/logs/actions-userdata-disk.log
          # kernel/payload 已经在上面进了 artifact 和 release，ram-data 只服务 payload 步骤。
          rm -rf out/hummer/kernel out/hummer/payload out/hummer/ram-data
          df -h . | tee -a out/hummer/logs/actions-userdata-disk.log
          ./unixnu build userdata 2>&1 | tee out/hummer/logs/actions-userdata.log
          df -h . | tee -a out/hummer/logs/actions-userdata-disk.log
          ls -l out/hummer/userdata/

      - name: Publish the root image in volumes
        if: ${{ github.event.inputs.root_image == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/hummer/userdata
          # BSD split（macOS）：-b 只认字节数，分卷后缀用 -a。
          split -b 1992294400 -a 1 userdata-root.img userdata-root.img.part
          ls -l
          # 上一轮的旧分卷先删掉，否则 5 卷变 6 卷、用户 cat 出来就是坏的。
          for asset in $(gh release view ci-latest --json assets \
                 --jq '.assets[].name' | grep '^userdata-root.img.part'); do
            gh release delete-asset ci-latest "$asset" -y || true
          done
          for f in userdata-root.img.part*; do
            gh release upload ci-latest "$f" --clobber
          done
          gh release upload ci-latest userdata-root.json --clobber

      - name: Result
        run: |
          if [ "$KERNEL_BUILT" = "yes" ]; then echo "kernel + payload built"; else echo "kernel did not build"; exit 1; fi
